# IPC-BNS Transition Platform — full stack
# Usage: docker compose up --build
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:3000
      # Auth — values come from .env (copy .env.example). Fails fast if the
      # JWT signing key is missing so we never run with the dev default.
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:?set AUTH_SECRET_KEY in .env (see .env.example)}
      - AUTH_USERNAME=${AUTH_USERNAME:-analyst}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-nyayasetu2026}
      - AUTH_TOKEN_TTL_MINUTES=${AUTH_TOKEN_TTL_MINUTES:-60}
      # - OPENAI_API_KEY=...      # optional real LLM
      # - ANTHROPIC_API_KEY=...   # optional real LLM
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
